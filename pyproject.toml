[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "winmol_unet"
version = "0.1.0"
# 3.11+: the analyzer this ships into uses `str | None` annotations (3.10+), and
# the 3.9 venv could not import it at all. The working environment is the conda
# env `WINMOL_segmentor_pt` (3.11), which runs the repo, the analyzer and the
# Keras-2 model loads from one interpreter.
requires-python = ">=3.11"
dependencies = [
    # onnxruntime >=1.19 is the first release that supports numpy 2.x; with the older
    # >=1.16 floor pip could pair numpy 2.x (allowed below) with an onnxruntime that
    # requires numpy <2 and fail to resolve. Keeping numpy unbounded is then safe.
    "numpy>=1.21",
    # onnx >=1.18 is the first release built against protobuf 6, the version TensorFlow
    # 2.20 requires (>=5.28). onnx 1.17 and earlier bundle their own older protobuf C++
    # runtime; with both packages in one process, whichever loads second aborts
    # ("mutex lock failed") or deadlocks ("RAW: Lock blocking"). Nothing in the declared
    # ranges catches it — the clash is at the native ABI level, so pip resolves it
    # happily. This bit --export-keras, which imports onnx then TensorFlow in a single
    # process. See tests/test_onnx_tf_coexist.py.
    "onnx>=1.18",
    "onnxruntime>=1.19",
    "scikit-image>=0.19",
]

[project.optional-dependencies]
# onnxscript: torch's dynamo ONNX exporter imports it; without it
# export_to_onnx fails at runtime on torch >= 2.5
torch = ["torch>=2.0", "onnxscript>=0.1"]
keras = ["tensorflow>=2.13"]
train = ["torch>=2.0", "onnxscript>=0.1", "torchvision>=0.15", "pillow>=9", "tensorboard>=2.10", "albumentations>=2.0", "segmentation-models-pytorch>=0.5"]
wandb = ["wandb>=0.16", "python-dotenv>=1.0"]
# Static training figures (--plots) and the per-epoch val panels train.py already
# logs to TensorBoard. Both import matplotlib lazily, so this stays optional --
# without it the panels are skipped, never fatal.
plots = ["matplotlib>=3.7"]
# Reading orthomosaics and digitized stem annotations. Kept out of [train] so the
# training and ONNX-serving paths never pull GDAL: only scripts/ needs these.
geo = ["rasterio>=1.3", "fiona>=1.9", "shapely>=2.0", "pillow>=9"]
# Post-training optimization, i.e. rebuilding the _fp16 and _int8 release assets with
# scripts/quantize_unet.py. onnxconverter-common was previously installed only inside
# Dockerfile.convert and Dockerfile.onnxgpu, so a plain `pip install -e ".[train]"`
# checkout could build the fp32 assets of a release but not its fp16 ones -- and only
# found out at the point of conversion. Declared here so the repo can rebuild everything
# it publishes.
optimize = ["onnxconverter-common>=1.14"]
dev = ["pytest>=7"]

[project.scripts]
# Same code as the root-level prepare.py / train.py / infer.py / evaluate.py; these exist
# so the commands keep working after `pip install`, where the repo root is not on the path.
winmol-prepare = "winmol_unet.cli.prepare:main"
winmol-train = "winmol_unet.cli.train:main"
winmol-infer = "winmol_unet.cli.infer:main"
winmol-evaluate = "winmol_unet.cli.evaluate:main"

[tool.setuptools]
# `training` used to be a top-level package and was deliberately not shipped, because
# that generic a name risks namespace collisions in a consumer environment. It now lives
# under `winmol_unet.training`, which removes that objection, so it ships.
#
# Shipping it stays safe for the analyzer's torch-free install: `winmol_unet/__init__.py`
# imports nothing, and `runtime`/`contract` import only onnxruntime and numpy. The heavy
# subpackages are inert until imported by name. tests/test_import_boundary.py pins that —
# do not add an eager import to any __init__ here.
packages = [
    "winmol_unet",
    "winmol_unet.training",
    "winmol_unet.geo",
    "winmol_unet.data",
    "winmol_unet.cli",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning:torch.onnx",
    "ignore:.*legacy TorchScript.*:DeprecationWarning",
]
