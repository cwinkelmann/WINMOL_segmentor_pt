[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "winmol_unet"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21",
    "onnx>=1.14",
    "onnxruntime>=1.16",
    "scikit-image>=0.19",
]

[project.optional-dependencies]
torch = ["torch>=2.0"]
keras = ["tensorflow>=2.13"]
train = ["torch>=2.0", "torchvision>=0.15", "pillow>=9", "tensorboard>=2.10"]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["winmol_unet", "training"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning:torch.onnx",
    "ignore:.*legacy TorchScript.*:DeprecationWarning",
]
