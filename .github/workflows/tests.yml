name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # a new push to the same PR cancels the previous run rather than queueing behind it
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install (CPU torch)
        run: |
          python -m pip install -U pip
          # the CPU wheel index keeps the install ~2 GB smaller and the runner has no GPU
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[train,dev,geo,plots]"  # plots: the --plots tests assert PNGs exist

      - name: Show environment
        run: pip list | grep -iE "^(torch|onnx|numpy|albumentations|segmentation)" || true

      - name: Run tests
        # tensorflow is NOT installed: the Keras-mirror tests are skipped, which is the
        # documented opt-in path (--export-keras). Everything else must pass.
        run: pytest -q --durations=10

  lint-contract:
    # the analyzer installs winmol_unet WITHOUT torch/tf; if an analyzer-facing module
    # ever grows a heavy import, that breaks the consumer and no unit test would catch it
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install base package only
        run: |
          python -m pip install -U pip
          pip install -e .
      - name: A non-editable install must ship every subpackage and console script
        # `pip install -e .` resolves imports from the source tree, so it cannot catch a
        # subpackage missing from [tool.setuptools] packages -- the wheel would omit it and
        # only a real user would find out. Install non-editable into a clean venv, from a
        # directory where the source tree is NOT importable, and drive the console scripts.
        run: |
          python -m venv /tmp/wheeltest
          /tmp/wheeltest/bin/pip install -q -U pip
          /tmp/wheeltest/bin/pip install -q .
          cd /tmp    # so ./winmol_unet cannot satisfy the import
          /tmp/wheeltest/bin/python -c "
          import importlib
          for m in ('winmol_unet', 'winmol_unet.contract', 'winmol_unet.runtime',
                    'winmol_unet.preprocess', 'winmol_unet.cli', 'winmol_unet.cli.prepare',
                    'winmol_unet.cli.train', 'winmol_unet.cli.infer',
                    'winmol_unet.cli.evaluate', 'winmol_unet.geo', 'winmol_unet.training',
                    # data/* must import on a BASE install: these are the no-GDAL,
                    # no-torch conversion paths, and importing a helper from a torch-
                    # importing module silently broke that once already.
                    'winmol_unet.data', 'winmol_unet.data.pairing',
                    'winmol_unet.data.build', 'winmol_unet.data.split'):
              importlib.import_module(m)
          print('all subpackages present in the wheel')
          "
          # These two answer --help on a BASE install because their heavy imports live
          # inside main(). winmol-train is deliberately NOT here: it imports torch at
          # module scope via run_train, so it needs the [train] extra and failing here is
          # correct, not a bug to fix by adding it to this list.
          /tmp/wheeltest/bin/winmol-prepare --help > /dev/null
          /tmp/wheeltest/bin/winmol-evaluate --help > /dev/null
          /tmp/wheeltest/bin/winmol-infer --help > /dev/null
          echo "console scripts registered"

      - name: Analyzer-facing modules must import without torch/tensorflow
        run: |
          python - <<'PY'
          import importlib, sys
          for m in ("winmol_unet.contract", "winmol_unet.runtime", "winmol_unet.preprocess"):
              importlib.import_module(m)
          heavy = [m for m in ("torch", "tensorflow", "albumentations") if m in sys.modules]
          if heavy:
              raise SystemExit(f"analyzer-facing import pulled in heavy deps: {heavy}")
          print("contract boundary intact:", sorted(m for m in sys.modules if m.startswith("winmol_unet")))
          PY
